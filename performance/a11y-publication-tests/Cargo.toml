[package]
name = "mineral-a11y-publication-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
accesskit = "=0.24.1"
accesskit_consumer = "=0.36.0"
# GPUI collections reexports this exact alias; avoid pulling unrelated GPUI
# workspace dependencies into the consumer-level production-module tests.
collections = { package = "rustc-hash", version = "=2.1.3" }

[lib]
path = "tests.rs"
