[package]
name = "document-view"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Adaptive layout, hit-testing, virtualization, and outline for rich Markdown documents"

[features]
# Explicit diagnostic builds only; never enabled by normal application builds.
layout-validation = []

[dependencies]
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true
anyrender.workspace = true
anyrender_vello_cpu.workspace = true
# Feature-only bridge: decode embedded PNG glyphs in trusted installed fonts.
vello_cpu.workspace = true
png.workspace = true
document-core.workspace = true
gpui.workspace = true
gpui-component.workspace = true
latex-rust.workspace = true
mermaid-rs-renderer.workspace = true
usvg.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
smallvec.workspace = true
thiserror.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
roxmltree.workspace = true

[lints]
workspace = true
